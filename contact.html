<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | TrailReady Gear</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <!-- Navigation (same) -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center"><a href="/" class="text-2xl font-bold text-green-700"><i class="fas fa-mountain mr-2 text-green-600"></i>TrailReady Gear</a></div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="/" class="text-gray-700 hover:text-green-600">Home</a>
                    <a href="/blog/" class="text-gray-700 hover:text-green-600">Reviews</a>
                    <a href="/calculator.html" class="text-gray-700 hover:text-green-600">Pack Calculator</a>
                    <a href="#newsletter" class="text-gray-700 hover:text-green-600">Newsletter</a>
                    <a href="/about.html" class="text-gray-700 hover:text-green-600">About</a>
                    <a href="/contact.html" class="text-gray-700 hover:text-green-600">Contact</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-16">
        <h1 class="text-4xl font-bold text-center mb-4">Get in Touch</h1>
        <p class="text-xl text-gray-600 text-center mb-12">Questions about gear? Want to collaborate? We'd love to hear from you.</p>

        <div class="bg-white rounded-xl shadow-lg p-8">
            <form id="contact-form" class="space-y-6">
                <div class="grid md:grid-cols-2 gap-6">
                    <div><label class="block text-gray-700 font-semibold mb-2">Name *</label><input type="text" id="name" required class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500"></div>
                    <div><label class="block text-gray-700 font-semibold mb-2">Email *</label><input type="email" id="email" required class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500"></div>
                </div>
                <div><label class="block text-gray-700 font-semibold mb-2">Subject</label><input type="text" id="subject" class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500"></div>
                <div><label class="block text-gray-700 font-semibold mb-2">Message *</label><textarea id="message" rows="6" required class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500"></textarea></div>
                <button type="submit" class="w-full bg-green-600 text-white py-4 rounded-lg font-semibold hover:bg-green-700 transition">Send Message</button>
            </form>
            <div id="contact-success" class="hidden mt-4 p-4 bg-green-100 text-green-700 rounded-lg text-center">Thanks! Your message has been sent. We'll reply within 2 business days.</div>
        </div>
    </div>

    <footer class="bg-gray-900 text-gray-300 py-12"><div class="max-w-7xl mx-auto px-4 text-center"><p>&copy; 2026 TrailReady Gear. All rights reserved.</p></div></footer>

    <script>
        document.getElementById('contact-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const button = e.target.querySelector('button');
            button.disabled = true;
            button.textContent = 'Sending...';
            try {
                const response = await fetch('/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('name').value,
                        email: document.getElementById('email').value,
                        subject: document.getElementById('subject').value,
                        message: document.getElementById('message').value,
                        timestamp: new Date().toISOString()
                    })
                });
                if (response.ok) {
                    e.target.reset();
                    document.getElementById('contact-success').classList.remove('hidden');
                } else {
                    alert('Something went wrong. Please try again later.');
                }
            } catch (error) {
                alert('Network error. Please check your connection.');
            } finally {
                button.disabled = false;
                button.textContent = 'Send Message';
            }
        });
    </script>
</body>
</html>
